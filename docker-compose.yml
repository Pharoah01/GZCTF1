services:
  gzctf:
    build: .
    container_name: gzctf-app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      GZCTF_ADMIN_PASSWORD : $GZCTF_ADMIN_PASSWORD
      GZCTF_XorKey: ${GZCTF_XorKey}
      GZCTF_ConnectionStrings__Database: ${GZCTF_ConnectionStrings__Database}
      GZCTF_ConnectionStrings__RedisCache: ${GZCTF_ConnectionStrings__RedisCache}
      ASPNETCORE_URLS: http://0.0.0.0:8080
    volumes:
      - gzctf-files:/app/files
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: gzctf-db
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD 
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: gzctf-redis
    command: ["redis-server", "--requirepass", "Admin@owasp-sist"]
    restart: unless-stopped

volumes:
  pgdata:
  gzctf-files:
